<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#141138">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Словарный Ресурс — Слово-перевод</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(120% 120% at 50% 0%, #1b2a6b 0%, #141138 45%, #0c0a22 100%);
    color: #eef0ff;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }
  header {
    width: 100%;
    max-width: 520px;
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 20px 6px;
    text-align: center;
  }
  header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: .02em; }
  header p { font-size: .8rem; color: #9aa3d0; margin-top: 4px; }
  main {
    width: 100%;
    max-width: 520px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 12px 20px calc(env(safe-area-inset-bottom, 0px) + 24px);
  }
  .card {
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 24px;
    padding: 28px 22px;
    backdrop-filter: blur(8px);
    text-align: center;
    animation: pop .35s ease;
  }
  @keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .progress {
    height: 6px; border-radius: 3px;
    background: rgba(255,255,255,.12);
    overflow: hidden; margin-bottom: 18px;
  }
  .progress > div {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #7c6cff, #48d8ff);
    transition: width .3s ease;
  }
  .counter { font-size: .78rem; color: #9aa3d0; margin-bottom: 14px; }

  .word { font-size: 2.6rem; font-weight: 800; letter-spacing: .01em; }
  .transcription { color: #8fd8ff; font-size: 1.05rem; margin-top: 6px; min-height: 1.4em; }

  .speaker {
    margin: 18px auto 4px;
    width: 64px; height: 64px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #7c6cff, #48d8ff);
    color: #fff; font-size: 1.6rem;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(124,108,255,.45);
    transition: transform .15s ease;
  }
  .speaker:active { transform: scale(.9); }

  .options { display: grid; gap: 12px; margin-top: 22px; }
  .option {
    padding: 16px 18px;
    font-size: 1.15rem; font-weight: 600;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.07);
    color: #eef0ff;
    cursor: pointer;
    transition: transform .12s ease, background .2s ease, border-color .2s ease;
  }
  .option:active { transform: scale(.97); }
  .option.correct { background: rgba(46, 213, 115, .25); border-color: #2ed573; }
  .option.wrong   { background: rgba(255, 99, 99, .25);  border-color: #ff6363; animation: shake .3s ease; }
  .option:disabled { cursor: default; opacity: .85; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  .big-btn {
    margin-top: 26px;
    width: 100%;
    padding: 18px;
    font-size: 1.2rem; font-weight: 700;
    border: none; border-radius: 18px;
    background: linear-gradient(135deg, #7c6cff, #48d8ff);
    color: #fff; cursor: pointer;
    box-shadow: 0 8px 28px rgba(124,108,255,.4);
    transition: transform .15s ease;
  }
  .big-btn:active { transform: scale(.97); }

  .score { font-size: 3.4rem; font-weight: 800; margin: 8px 0; }
  .stars { font-size: 2rem; letter-spacing: .2em; margin: 6px 0 4px; }
  .note { font-size: .8rem; color: #9aa3d0; margin-top: 14px; line-height: 1.5; }
  .hint  { font-size: .85rem; color: #b9c0e8; margin-top: 10px; min-height: 1.3em; }
</style>
</head>
<body>
<header>
  <h1>Словарный Ресурс</h1>
  <p>Игра 1 · Слово-перевод · прототип</p>
</header>
<main id="screen"></main>
<script src="words.js"></script>
<script>
(function () {
  var screen = document.getElementById('screen');
  var WORDS = window.WORDS || [];
  var order = [], idx = 0, correct = 0, mistakes = [], startTime = 0;

  // ---------- Звук ----------
  var audioOk = {}; // кэш: есть ли mp3 для слова
  function playWord(word) {
    var el = new Audio('audio/' + word.en + '.mp3');
    el.onerror = function () { speakFallback(word.en); };
    var p = el.play();
    if (p && p.catch) p.catch(function () { /* файл ещё не сгенерирован */ speakFallback(word.en); });
  }
  function speakFallback(text) {
    try {
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.9;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    } catch (e) { /* нет голоса — не страшно */ }
  }
  function tone(freq, dur, type) {
    try {
      var ctx = tone.ctx || (tone.ctx = new (window.AudioContext || window.webkitAudioContext)());
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type || 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(.18, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + dur);
    } catch (e) {}
  }

  // ---------- Утилиты ----------
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function el(html) {
    var d = document.createElement('div');
    d.innerHTML = html;
    return d.firstElementChild;
  }

  // ---------- Экраны ----------
  function showStart() {
    screen.innerHTML = '';
    var card = el(
      '<div class="card">' +
        '<div style="font-size:3rem">🗣️</div>' +
        '<h2 style="margin:10px 0 6px">Слово-перевод</h2>' +
        '<p class="note">Слушай английское слово и выбирай его перевод.<br>' +
        WORDS.length + ' слов · без интернета после загрузки</p>' +
        '<button class="big-btn">Начать</button>' +
        '<p class="note" id="audionote"></p>' +
      '</div>'
    );
    card.querySelector('.big-btn').onclick = startGame;
    // Проверим, есть ли сгенерированная озвучка (по первому слову)
    fetch('audio/' + WORDS[0].en + '.mp3', { method: 'HEAD' })
      .then(function (r) {
        if (!r.ok) throw 0;
        card.querySelector('#audionote').textContent = '🔊 Студийная озвучка подключена';
      })
      .catch(function () {
        card.querySelector('#audionote').textContent =
          'Пока звучит встроенный голос телефона. Студийная озвучка появится после генерации mp3.';
      });
    screen.appendChild(card);
  }

  function startGame() {
    order = shuffle(WORDS.slice());
    idx = 0; correct = 0; mistakes = [];
    startTime = Date.now();
    showRound();
  }

  function showRound() {
    if (idx >= order.length) return showResult();
    var w = order[idx];
    var others = shuffle(WORDS.filter(function (x) { return x.en !== w.en; })).slice(0, 3);
    var options = shuffle([w].concat(others));

    screen.innerHTML = '';
    var card = el(
      '<div class="card">' +
        '<div class="progress"><div style="width:' + (idx / order.length * 100) + '%"></div></div>' +
        '<div class="counter">Слово ' + (idx + 1) + ' из ' + order.length + '</div>' +
        '<div class="word">' + w.en + '</div>' +
        '<div class="transcription">[' + w.tr + ']</div>' +
        '<button class="speaker" title="Прослушать">🔊</button>' +
        '<div class="options">' +
          options.map(function (o) {
            return '<button class="option" data-en="' + o.en + '">' + o.ru + '</button>';
          }).join('') +
        '</div>' +
        '<div class="hint">Нажми на 🔊, чтобы послушать ещё раз</div>' +
      '</div>'
    );
    card.querySelector('.speaker').onclick = function () { playWord(w); };
    var locked = false;
    Array.prototype.forEach.call(card.querySelectorAll('.option'), function (btn) {
      btn.onclick = function () {
        if (locked) return;
        locked = true;
        var ok = btn.dataset.en === w.en;
        if (ok) {
          btn.classList.add('correct');
          correct++;
          tone(660, .18); setTimeout(function(){ tone(880, .25); }, 110);
        } else {
          btn.classList.add('wrong');
          mistakes.push(w);
          tone(220, .3, 'triangle');
          Array.prototype.forEach.call(card.querySelectorAll('.option'), function (b) {
            if (b.dataset.en === w.en) b.classList.add('correct');
          });
        }
        Array.prototype.forEach.call(card.querySelectorAll('.option'), function (b) { b.disabled = true; });
        setTimeout(function () { idx++; showRound(); }, ok ? 700 : 1400);
      };
    });
    screen.appendChild(card);
    setTimeout(function () { playWord(w); }, 250);
  }

  function showResult() {
    var total = order.length;
    var pct = correct / total;
    var stars = pct >= .95 ? '★★★' : pct >= .75 ? '★★☆' : pct >= .5 ? '★☆☆' : '☆☆☆';
    var secs = Math.round((Date.now() - startTime) / 1000);
    var best = 0;
    try {
      best = parseInt(localStorage.getItem('slovarny_best') || '0', 10);
      if (correct > best) { best = correct; localStorage.setItem('slovarny_best', String(best)); }
    } catch (e) {}

    screen.innerHTML = '';
    var repeatBlock = mistakes.length
      ? '<p class="note">Стоит повторить: ' + mistakes.map(function (m) { return '<b>' + m.en + '</b> — ' + m.ru; }).join(', ') + '</p>'
      : '<p class="note">Без единой ошибки — отличный результат! 🎉</p>';
    var card = el(
      '<div class="card">' +
        '<div class="stars">' + stars + '</div>' +
        '<div class="score">' + correct + ' / ' + total + '</div>' +
        '<p class="note">Время: ' + secs + ' с · Рекорд: ' + best + ' / ' + total + '</p>' +
        repeatBlock +
        '<button class="big-btn">Играть ещё раз</button>' +
      '</div>'
    );
    card.querySelector('.big-btn').onclick = startGame;
    screen.appendChild(card);
  }

  showStart();
})();
</script>
<script>
// Офлайн-режим: регистрируем service worker
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
